- hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "vars/user_vaults/vault_{{ lookup('env', 'USER') }}.yml"
  roles:
    - { role: common,                         tags: common }
    - { role: devsec.hardening.ssh_hardening, tags: ssh }
    - { role: tailscale,                      tags: tailscale }
    - { role: nvidia,                         tags: nvidia }
    - { role: selinux,                        tags: selinux }
    - { role: samba,                          tags: samba }
    - { role: podman,                         tags: podman }
