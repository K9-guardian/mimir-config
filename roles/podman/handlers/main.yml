- name: Reload podman systemd
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ daemon-reload"
  changed_when: true

- name: Restart podman jellyfin
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart jellyfin"
  changed_when: true

- name: Restart podman seerr
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart seerr"
  changed_when: true

- name: Restart podman prowlarr
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart prowlarr"
  changed_when: true

# - name: Restart podman radarr
#   ansible.builtin.command:
#     cmd: "systemctl --user --machine=podman@ restart radarr"
#   changed_when: true

- name: Configure SELinux context for gluetun config
  community.general.sefcontext:
    setype: container_file_t
    path: "/etc/containers/systemd/users/{{ podman_uid }}/gluetun-config.toml"
    state: present
  register: fcontext_changes

- name: Restore SELinux context for gluetun config
  ansible.builtin.command:
    cmd: "restorecon -rF /etc/containers/systemd/users/{{ podman_uid }}/gluetun-config.toml"
  when: fcontext_changes.changed
  changed_when: true

- name: Restart podman slskd
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart slskd-vpn-gluetun"
  changed_when: true

- name: Restart podman nicotine
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart nicotine-vpn-gluetun"
  changed_when: true

- name: Restart podman transmission
  ansible.builtin.command:
    cmd: "systemctl --user --machine=podman@ restart transmission-vpn-gluetun"
  changed_when: true
