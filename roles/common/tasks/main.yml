- name: Create nasusers group
  ansible.builtin.group:
    name: nasusers
    state: present

- name: Create podman group
  ansible.builtin.group:
    name: podman
    state: present
    gid: "{{ podman_gid }}"

- name: Create podman user
  ansible.builtin.user:
    name: podman
    uid: "{{ podman_uid }}"
    shell: "/sbin/nologin"
    create_home: true
    group: podman
    groups: nasusers, systemd-journal
    append: true
    state: present

- name: Ensure parent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "/mnt/nas"
    - "/mnt/scratch"

- name: Create nas directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: nasusers
    mode: '775'
  loop:
    - { path: "/mnt/nas/share",   owner: "root" }
    - { path: "/mnt/nas/private", owner: "root" }

- name: Create scratch directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: nasusers
    mode: '2775'
  loop:
    - { path: "/mnt/scratch/slskd",                  owner: "podman" }
    - { path: "/mnt/scratch/nicotine",               owner: "podman" }
    - { path: "/mnt/scratch/transmission",           owner: "podman" }
    - { path: "/mnt/scratch/transmission/downloads", owner: "podman" }
    - { path: "/mnt/scratch/transmission/watch",     owner: "podman" }

- name: Install software
  ansible.builtin.dnf:
    name:
      - borgbackup
      - ffmpeg
      - jq
      - samba
    state: present
